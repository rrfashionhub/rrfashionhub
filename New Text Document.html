<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RR FASHION HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0A2540;
            --accent-gold: #D4AF37;
            --accent-red: #D90429;
            --whatsapp-green: #25d366;
            --light-bg: #F8F9FA;
            --text-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }

        .logo span {
            color: var(--accent-gold);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .hero {
            background: linear-gradient(rgba(10,37,64,0.85), rgba(10,37,64,0.85)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: white;
            text-align: center;
            padding: 4rem 2rem;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }

        .hero h1 span {
            color: var(--accent-gold);
        }

        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            color: var(--primary-blue);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 3px solid var(--accent-gold);
            text-align: center;
        }

        .product-img {
            height: 280px;
            background-size: cover;
            background-position: center;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }

        .product-price {
            font-size: 1.1rem;
            color: var(--accent-red);
            font-weight: bold;
        }

        /* WhatsApp Floating Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--whatsapp-green);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 100;
            text-decoration: none;
            transition: transform 0.3s;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        footer {
            background-color: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            border-top: 4px solid var(--accent-gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RR <span>FASHION HUB</span></div>
        <nav>
            <ul>
                <li><a href="#home">මුල් පිටුව</a></li>
                <li><a href="#catalog">ඇඳුම් එකතුව</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1><span>RR FASHION HUB</span> වෙත සාදරයෙන් පිළිගනිමු</h1>
        <p>නවතම ඇඳුම් පැළඳුම් පිළිබඳ වැඩි විස්තර ලබා ගැනීමට පහත WhatsApp අයිකනය භාවිතා කරන්න.</p>
    </section>

    <main class="container" id="catalog">
        <h2 class="section-title">අපගේ එකතුව</h2>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/94705029694?text=Hello%20RR%20Fashion%20Hub,%20I%20want%20to%20know%20more%20details." class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        <p>&copy; 2026 RR FASHION HUB. All Rights Reserved.</p>
    </footer>

</body>
</html>
